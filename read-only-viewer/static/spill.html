<!doctype html>
<html><head><meta charset="utf-8"><title>Sybil's Alcove — spillout</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/spill.css"></head><body>
<header>
  <h1>SYBIL'S ALCOVE</h1>
  <span class="muted">spillout</span>
  <select id="who" aria-label="session"></select>
  <select id="mins" aria-label="time window">
    <option value="10">last 10 min</option>
    <option value="60">last hour</option>
    <option value="360">last 6 hours</option>
    <option value="0" selected>everything in the tail</option>
  </select>
  <span class="grow"></span>
  <label class="muted"><input type="checkbox" id="wrap"> wrap</label>
  <label class="muted"><input type="checkbox" id="auto" checked> auto 5s</label>
  <button id="now">refresh</button>
  <a href="/" class="lnk">sessions &rarr;</a>
</header>
<div class="wrap" id="out"><p class="muted">loading…</p></div>
<script type="module" src="/static/spill.js"></script></body></html>
