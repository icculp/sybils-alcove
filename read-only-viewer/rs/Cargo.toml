[package]
name = "alcove"
version = "0.1.0"
edition = "2021"
description = "Read-only viewer for Claude Code and Codex agent sessions"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
